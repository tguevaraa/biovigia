{% for campo in form %}
  {% if campo.name == "is_active" %}
  <div class="form-check mb-3">{{ campo }} <label class="form-check-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label></div>
  {% else %}
  <div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>{{ campo }}
    {% for e in campo.errors %}<div class="small mt-1" style="color: var(--bad-ink)"><i class="bi bi-x-circle" aria-hidden="true"></i> {{ e }}</div>{% endfor %}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
  </div>
  {% endif %}
{% endfor %}
